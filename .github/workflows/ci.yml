# CI — 01 mục 7.2 bước 1 (PR: make lint + make test; đỏ thì không merge) + cổng 1 "CI trên GitHub xanh".
# Chạy ĐẦY ĐỦ: unit + integration (testcontainers Postgres 16 — runner ubuntu có Docker) + e2e
# (mock chạy bằng uvicorn trên cổng local) + test mock_services. Không có key thật nào: test không
# gọi LLM, token/khoá sinh ngẫu nhiên trong fixture. Tokenizer bge-m3 (chỉ 3 file, không trọng số) tải bằng
# `make tokenizer` cho test chunker `tokenizer_real` — thiếu tokenizer trong CI thì test FAIL, không skip.
# Phase 4a P1 (Việc treo 1, hạn 19/10/2026): runner GHIM `ubuntu-24.04` (không theo `ubuntu-latest` sang Ubuntu 26); action
# lên major THẤP NHẤT chạy Node 24 (đọc `runs.using` trong action.yml trên GitHub, 30/09/2026): checkout v5, cache v5,
# setup-uv v7 — v4/v4/v6 còn node20. Không lên checkout v6/v7, cache v6: ít thay đổi hành vi nhất, input đang dùng vẫn còn.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # gitleaks detect trong make lint quét toàn bộ lịch sử commit

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cài phụ thuộc theo uv.lock (nhóm dev, không nhóm ml)
        run: uv sync --locked

      # G9: SPLIT.md do phiên git sinh lúc khoá nhãn; chưa có → chỉ cảnh báo (mã 0). Log chỉ số đếm, không tên file/sha.
      # EVAL_MODE chỉ ở step này (app.eval chặn import khi thiếu) — không lan sang make test.
      - name: Kiểm mã băm eval/SPLIT.md (G9)
        env:
          EVAL_MODE: "true"
          PYTHONPATH: backend
        run: uv run python scripts/eval/check_split.py --scenarios eval/the100

      - name: Cache tokenizer bge-m3 (không có trọng số)
        uses: actions/cache@v5
        with:
          path: models/_tokenizer
          key: bge-m3-tokenizer-${{ hashFiles('ml_service/models.lock.json') }}

      - name: make tokenizer (có cache thì bỏ qua)
        run: make tokenizer

      - name: Cài gitleaks (cùng bản với máy dev)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: make lint (ruff, mypy, import-linter, gitleaks)
        run: make lint

      - name: make test (unit + integration + e2e + mock)
        run: make test

  # Frontend (G5, 10/10/2026): kiểm tĩnh + vitest + kiểm bản build — KHÔNG chạy verify (cần stack + OTP người nhập).
  # Node 24: package-lock.json cần npm 11 (npm 10 lỗi `npm ci` EUSAGE quanh msw). setup-node v5 = major thấp nhất chạy
  # Node 24 theo `runs.using` trong action.yml (kiểm lại trên GitHub như header). Không cần secret, không cần Docker.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci (theo package-lock.json)
        run: npm ci

      - name: lint (eslint)
        run: npm run lint

      - name: typecheck (tsc app + node)
        run: npm run typecheck

      - name: check:style (token thiết kế)
        run: npm run check:style

      - name: test (vitest)
        run: npm test

      - name: check:dist (vite build + không lọt mock/dữ liệu giả vào bản build)
        run: npm run check:dist
