<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bản 4 — L2 hàng đợi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>body{margin:0}a{color:#0055A4}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Be Vietnam Pro', 'Segoe UI', sans-serif; color: #1D1D1F;">
  <dc-import name="B4Sidebar" role="l2" active="escalations" hint-size="264px,900px"></dc-import>
  <main style="flex-grow: 1; padding: 40px 48px; display: flex; flex-direction: column; gap: 24px; min-width: 0;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em;">Hàng đợi escalate</h1>
      <p style="margin: 0; font-size: 17px; line-height: 26px; color: #6E6E73;">7 ca đang mở · theo mức ưu tiên, rồi thời gian chờ.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <section style="display: flex; flex-direction: column; gap: 6px;">
          <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: {{g.ink}}; padding-left: 4px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{g.dot}};"></span>{{g.name}}</span>
          <div style="border: 1px solid #E5E5EA; border-radius: 14px; overflow: hidden;">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="1">
              <a href="B4L2Detail.dc.html" style="display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 14px; gap: 16px; align-items: center; height: 52px; padding: 0 20px; border-top: {{r.sep}}; text-decoration: none; color: #1D1D1F;">
                <span style="font-family: 'SF Mono', 'JetBrains Mono', monospace; font-size: 13px; line-height: 18px; color: #6E6E73;">{{r.code}}</span>
                <span style="font-size: 17px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.reason}}<sc-if value="{{r.deny}}" hint-placeholder-val="{{false}}"><span style="color: #C62828;"> · bị luật cấm</span></sc-if></span>
                <span style="font-size: 15px; line-height: 20px; color: #6E6E73;">{{r.meta}}</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </a>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const g = (name, dot, ink, rows) => ({ name, dot, ink, rows: rows.map((r, i) => ({ ...r, deny: !!r.deny, sep: i ? '1px solid #E5E5EA' : 'none' })) });
    return { groups: [
      g('An ninh', '#C62828', '#C62828', [{ code: 'E0', reason: 'Nội dung bị chặn ở bước sàng lọc', meta: 'Bùi Thị Hoa · chờ 6 phút' }]),
      g('Rất cao — thực thi lỗi', '#C62828', '#C62828', [{ code: 'E7', reason: 'Cài phần mềm lỗi giữa chừng, đã hoàn tác một phần', meta: 'Trần Thị Bình · bạn đang xử lý' }]),
      g('Cao', '#F37021', '#B4500B', [{ code: 'E5', reason: 'Xin quyền cho tài khoản bị vô hiệu hoá (R12)', meta: 'Nguyễn Văn An · chờ 9 phút', deny: true }, { code: 'E5', reason: 'AI đánh giá rủi ro cao (0,88)', meta: 'Ngô Thanh Sơn · chờ 41 phút' }]),
      g('Hạ tầng', '#0055A4', '#6E6E73', [{ code: 'E2', reason: 'Không gọi được AD sau 2 lần thử', meta: 'Hoàng Minh Châu · chờ 22 phút' }]),
      g('Thường', '#AEAEB2', '#6E6E73', [{ code: 'E3', reason: 'Chưa có tài liệu hướng dẫn phù hợp', meta: 'Phan Thu Giang · chờ 1 giờ' }, { code: 'E8', reason: 'Người dùng báo vẫn chưa xong', meta: 'Nguyễn Văn An · bạn đang xử lý' }])
    ] };
  }
}
</script>
</body>
</html>
