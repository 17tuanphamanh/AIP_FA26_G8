<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thanh bên — bản 4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Điều hướng chính" style="width: 264px; height: 100%; min-height: 900px; box-sizing: border-box; background: #F7F8FA; border-right: 1px solid #E5E5EA; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Be Vietnam Pro', 'Segoe UI', sans-serif; color: #1D1D1F;">
  <div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px;">
    <svg width="28" height="28" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#0055A4"></rect><path d="M9 10h18a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-9l-5 4v-4H9a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3z" fill="#FFFFFF"></path><path d="M12.5 17.5l3.4 3.4 6.6-6.6" fill="none" stroke="#F37021" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="font-size: 15px; line-height: 20px; font-weight: 600; flex-grow: 1;">ServiceDesk AI</span>
    <button type="button" aria-label="Thông báo, 2 mới" style="position: relative; width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: #F37021;"></span></button>
  </div>

  <sc-if value="{{isEmployee}}" hint-placeholder-val="{{true}}">
    <a href="B4EmpHome.dc.html" style="margin: 12px 0 8px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E5E5EA; text-decoration: none; color: #1D1D1F; font-size: 15px; line-height: 20px; font-weight: 600;"><span style="width: 20px; height: 20px; border-radius: 50%; background: #E8630A; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Yêu cầu mới</a>
    <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #6E6E73; padding: 12px 12px 4px;">Gần đây</span>
  </sc-if>
  <sc-if value="{{isStaff}}" hint-placeholder-val="{{false}}">
    <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #6E6E73; padding: 16px 12px 4px;">{{heading}}</span>
  </sc-if>

  <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
    <a href="{{it.href}}" style="{{it.style}}">
      <sc-if value="{{it.hasDot}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%; background: {{it.dot}};"></span></sc-if>
      <span style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{it.label}}</span>
      <sc-if value="{{it.hasCount}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; line-height: 18px; color: #6E6E73;">{{it.count}}</span></sc-if>
    </a>
  </sc-for>

  <span style="flex-grow: 1;"></span>
  <div style="height: 36px; margin: 0 8px 8px; border: 1px dashed #C7C7CC; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6E6E73;">Logo đơn vị</div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-top: 1px solid #E5E5EA; padding-top: 12px;">
    <span style="width: 32px; height: 32px; border-radius: 50%; background: #0055A4; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{initials}}</span>
    <span style="display: flex; flex-direction: column;"><span style="font-size: 15px; line-height: 20px; font-weight: 600;">{{user}}</span><span style="font-size: 13px; line-height: 18px; color: #6E6E73;">{{roleLabel}}</span></span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["employee","l1","l2","manager"],"default":"employee"},"active":{"editor":"text","default":"vpn"},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'employee';
    const active = this.props.active ?? 'vpn';
    const people = {
      employee: ['Nguyễn Văn An', 'Nhân viên · Kế toán', 'NA'], l1: ['Lê Thu Hà', 'IT Helpdesk L1', 'LH'],
      l2: ['Nguyễn Hoàng Long', 'Kỹ thuật viên L2', 'NL'], manager: ['Trần Minh Quân', 'Trưởng bộ phận IT', 'TQ']
    };
    const sets = {
      employee: { heading: '', items: [
        ['vpn', 'Lỗi VPN — chứng chỉ', 'B4EmpChat.dc.html', '#F37021'], ['multi', 'Mật khẩu, Visio, quyền', 'B4EmpDigest.dc.html', '#F37021'],
        ['folder', 'Quyền thư mục Kế toán', 'B4EmpStates.dc.html', '#F37021'], ['visio', 'Cài Microsoft Visio', '#', '#4DB848'], ['printer', 'Máy in tầng 3', '#', '#AEAEB2']] },
      l1: { heading: 'Người duyệt L1', items: [['approvals', 'Chờ tôi duyệt', 'B4L1Queue.dc.html', '', '5'], ['escalations', 'Escalation', '#', '', '7'], ['mine', 'Yêu cầu của tôi', '#'], ['dash', 'Hiệu suất của tôi', '#']] },
      l2: { heading: 'Kỹ thuật viên L2', items: [['escalations', 'Hàng đợi escalate', 'B4L2Queue.dc.html', '', '7'], ['kb', 'Tài liệu KB', '#'], ['mine', 'Yêu cầu của tôi', '#']] },
      manager: { heading: 'Trưởng bộ phận IT', items: [['overview', 'Tổng quan', 'B4MgrDashboard.dc.html'], ['alerts', 'Cảnh báo', '#', '', '2'], ['policy', 'Chính sách', 'B4MgrPolicy.dc.html'], ['approvals', 'Chờ tôi duyệt', '#'], ['kb', 'Tài liệu KB', '#']] }
    };
    const set = sets[role] || sets.employee;
    const p = people[role] || people.employee;
    return {
      isEmployee: role === 'employee', isStaff: role !== 'employee', heading: set.heading,
      user: p[0], roleLabel: p[1], initials: p[2],
      items: set.items.map(([id, label, href, dot, count]) => {
        const on = id === active;
        return { label, href, dot: dot || '', hasDot: !!dot, count: count || '', hasCount: !!count,
          style: 'display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 15px; line-height: 20px; color: #1D1D1F; ' + (on ? 'background: #E6EEF7; font-weight: 600; color: #0055A4;' : 'background: transparent; font-weight: 400;') };
      })
    };
  }
}
</script>
</body>
</html>
