<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bản 4 — đăng nhập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F5F5F7; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Be Vietnam Pro', 'Segoe UI', sans-serif; color: #1D1D1F;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
    <svg width="64" height="64" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#0055A4"></rect><path d="M9 10h18a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-9l-5 4v-4H9a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3z" fill="#FFFFFF"></path><path d="M12.5 17.5l3.4 3.4 6.6-6.6" fill="none" stroke="#F37021" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em;">{{title}}</h1>
    <p style="margin: 0; font-size: 17px; line-height: 26px; color: #6E6E73;">{{subtitle}}</p>
  </div>

  <div style="width: 400px; display: flex; flex-direction: column; gap: 16px;">
    <sc-if value="{{isPassword}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div style="background: #FFFFFF; border: 1px solid #E5E5EA; border-radius: 14px; overflow: hidden;">
          <label for="u4" style="position: absolute; left: -9999px;">Tên đăng nhập</label>
          <input id="u4" placeholder="Tên đăng nhập" value="an.nv" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 16px; border: none; border-bottom: 1px solid #E5E5EA; font: 400 17px/22px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif; color: #1D1D1F;">
          <label for="p4" style="position: absolute; left: -9999px;">Mật khẩu</label>
          <input id="p4" type="password" placeholder="Mật khẩu" value="xxxxxxxxxx" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 16px; border: none; font: 400 17px/22px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif;">
        </div>
        <button type="button" onClick="{{toOtp}}" style="height: 50px; border-radius: 25px; border: none; background: #0055A4; color: #FFFFFF; font: 600 17px/22px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif;">Đăng nhập</button>
      </div>
    </sc-if>
    <sc-if value="{{isOtp}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 16px; align-items: center;">
        <div style="display: flex; gap: 8px;"><sc-for list="{{digits}}" as="d" hint-placeholder-count="6"><input aria-label="Chữ số" value="{{d}}" maxlength="1" style="width: 56px; height: 64px; text-align: center; border-radius: 12px; border: 1px solid #E5E5EA; background: #FFFFFF; font: 600 22px/28px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif;"></sc-for></div>
        <button type="button" style="width: 100%; height: 50px; border-radius: 25px; border: none; background: #0055A4; color: #FFFFFF; font: 600 17px/22px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif;">Xác nhận</button>
        <button type="button" onClick="{{toPassword}}" style="height: 44px; border: none; background: transparent; color: #0055A4; font: 400 17px/22px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif;">Quay lại</button>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <span style="font-size: 13px; line-height: 18px; color: #6E6E73;">Demo — đăng nhập nhanh</span>
    <div style="display: flex; padding: 2px; border-radius: 9px; background: #E9E9EE;">
      <button type="button" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; background: transparent; font: 400 15px/20px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif; color: #1D1D1F;">Nhân viên</button>
      <button type="button" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; background: transparent; font: 400 15px/20px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif; color: #1D1D1F;">L1</button>
      <button type="button" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; background: transparent; font: 400 15px/20px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif; color: #1D1D1F;">L2</button>
      <button type="button" onClick="{{toOtp}}" style="height: 32px; padding: 0 14px; border-radius: 7px; border: none; background: transparent; font: 400 15px/20px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif; color: #1D1D1F;">Trưởng BP IT</button>
    </div>
  </div>

  <div style="position: absolute; bottom: 32px; display: flex; align-items: center; gap: 16px;">
    <span style="width: 112px; height: 36px; border: 1px dashed #C7C7CC; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6E6E73;">Logo đơn vị</span>
    <span style="font-size: 13px; line-height: 18px; color: #6E6E73;">Đồ án tốt nghiệp — Trường Đại học FPT</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["password","otp"],"default":"password"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: null }; }
  renderVals() {
    const step = this.state.step ?? this.props.step ?? 'password';
    const otp = step === 'otp';
    return { isPassword: !otp, isOtp: otp, digits: ['4', '8', '1', '', '', ''],
      title: otp ? 'Nhập mã xác thực' : 'Đăng nhập',
      subtitle: otp ? 'Mã 6 số trong ứng dụng xác thực trên điện thoại.' : 'Dùng tài khoản công ty (AD) của bạn.',
      toOtp: () => this.setState({ step: 'otp' }), toPassword: () => this.setState({ step: 'password' }) };
  }
}
</script>
</body>
</html>
