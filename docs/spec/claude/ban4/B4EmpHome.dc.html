<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bản 4 — trang chủ nhân viên</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>body{margin:0}a{color:#0055A4}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Be Vietnam Pro', 'Segoe UI', sans-serif; color: #1D1D1F;">
  <dc-import name="B4Sidebar" role="employee" active="none" hint-size="264px,900px"></dc-import>
  <main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 80px;">
    <div style="width: 720px; display: flex; flex-direction: column; align-items: center;">
      <a href="B4EmpStates.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; background: #FFF4EC; color: #B4500B; font-size: 15px; line-height: 20px; text-decoration: none;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #F37021;"></span>1 yêu cầu đang chờ IT duyệt</a>
      <h1 style="margin: 24px 0 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em; text-align: center;">Chào An, hôm nay IT giúp gì cho bạn?</h1>

      <div style="margin-top: 32px; width: 100%; box-sizing: border-box; border: 1px solid #E5E5EA; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04); padding: 20px 20px 12px 24px; display: flex; flex-direction: column; gap: 12px;">
        <label for="ask4" style="position: absolute; left: -9999px;">Mô tả vấn đề</label>
        <textarea id="ask4" rows="2" placeholder="Mô tả vấn đề như đang nhắn cho đồng nghiệp…" style="border: none; resize: none; background: transparent; font: 400 17px/26px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif; color: #1D1D1F;"></textarea>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: #6E6E73;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Mật khẩu lỡ gõ sẽ được tự động ẩn</span>
          <span style="flex-grow: 1;"></span>
          <button type="button" aria-label="Gửi" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #E8630A; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
        </div>
      </div>

      <div style="margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
          <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E5E5EA; background: #FFFFFF; color: #1D1D1F; font: 400 15px/20px -apple-system, BlinkMacSystemFont, 'Be Vietnam Pro', sans-serif;">{{c}}</button>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { chips: ['Quên mật khẩu', 'Lỗi VPN', 'Cài phần mềm', 'Xin quyền truy cập'] }; }
}
</script>
</body>
</html>
