# Bộ câu kiểm tra truy hồi — MẪU định dạng (kb/eval/retrieval_set.yaml)
#
# Mục đích: chọn ngưỡng "có căn cứ" RETRIEVAL_THRESHOLD (P3 mục 7.1) và làm cổng kiểm khi nạp KB mới.
# KHÔNG dùng làm tập đánh giá RQ, không trộn với bộ kịch bản M8.
#
# Yêu cầu bộ thật:
#   - >= 30 câu có đáp án (expected_doc_ids không rỗng)
#   - >= 20 câu KHÔNG có đáp án (expected_doc_ids: []), trong đó >= 8 câu near_topic: true
#   - Viết như người dùng thật gõ: viết tắt, không dấu, sai chính tả nhẹ, dài dòng, cộc lốc
#   - Không chép câu từ tài liệu; người viết câu khác người viết tài liệu
#   - Có cặp câu hỏi nội dung restricted: role l1 (có đáp án) và role employee (đáp án rỗng)
#
# Trường:
#   id                 P### (có đáp án) | N### (không có đáp án) — duy nhất
#   query              câu hỏi như người dùng gõ
#   intent             vpn | account | software | access | out_of_scope — intent ĐÚNG của câu
#   role               employee | l1 | l2 | manager — quyền dùng khi truy hồi
#   expected_doc_ids   danh sách doc_id chứa câu trả lời; [] nếu KB không có
#   near_topic         chỉ với câu không có đáp án: true nếu gần chủ đề KB (dễ bị "trả lời bừa")
#   note               tùy chọn

version: 1
kb_scope: [vpn]
