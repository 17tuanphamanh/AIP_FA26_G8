# Thuộc tính rủi ro của từng hành động (phase3 mục 9.2; build_action → Action → M5). Nạp và kiểm ở
# backend/app/settings.py (ActionMetadataFile, extra=forbid): mọi action_type trong slots.yaml phải có dòng ở đây —
# thiếu → backend/worker từ chối khởi động (KHÔNG mặc định reversible). reversible phải khớp reversibility (none ↔ false).
# procedure_doc (Phase 4 S0-P10, Q-4-U A+, D-34): doc_id tài liệu QUY TRÌNH của hành động — BẮT BUỘC (mẫu doc_id KB). B11 kiểm
# tài liệu có, enabled, người gửi được xem trong KB hiện hành (alias) → không: E3 no_procedure. `make ingest` cảnh báo khi thiếu.
vpn:
  renew_vpn_cert:     {reversible: true, reversibility: full, data_sensitivity: low, scope: single_device, privilege_level: standard_user, procedure_doc: KB-VPN-004}
  reissue_vpn_access: {reversible: true, reversibility: full, data_sensitivity: low, scope: single_device, privilege_level: standard_user, procedure_doc: KB-VPN-004}
  check_vpn_status:   {reversible: true, reversibility: full, data_sensitivity: low, scope: single_device, privilege_level: standard_user, procedure_doc: KB-VPN-001}
# Phase 5 T22a (phase5 bảng 4.2; procedure_doc [Chốt 09/10] theo K2 thật): 3 intent khai báo, CHƯA bật — check_intent_config đòi
# metadata cho mọi action_type đã khai báo trong slots.yaml (bật hay không). data_sensitivity/privilege_level tĩnh [Chốt B11 §0.3];
# độ nhạy thật của tài nguyên và quyền tài khoản đích nằm ở fact (domain/facts.py) — luật đọc fact, không đọc hai trường này.
account:
# procedure_doc_privileged (13/11): căn cứ hiện trên thẻ duyệt khi tài khoản đích là tài khoản dịch vụ / quản trị (KB-ACC-003).
  reset_password:     {reversible: true, reversibility: partial, data_sensitivity: medium, scope: single_account, privilege_level: standard_user, procedure_doc: KB-ACC-001, procedure_doc_privileged: KB-ACC-003}
  unlock_account:     {reversible: true, reversibility: full, data_sensitivity: low, scope: single_account, privilege_level: standard_user, procedure_doc: KB-ACC-002, procedure_doc_privileged: KB-ACC-003}
software:
  install_software:   {reversible: true, reversibility: partial, data_sensitivity: low, scope: single_device, privilege_level: standard_user, procedure_doc: KB-SW-001}
access:
  view_permissions:   {reversible: true, reversibility: full, data_sensitivity: low, scope: single_account, privilege_level: standard_user, procedure_doc: KB-ACS-005}
  grant_permission:   {reversible: true, reversibility: full, data_sensitivity: medium, scope: single_account, privilege_level: standard_user, procedure_doc: KB-ACS-001}
  extend_permission:  {reversible: true, reversibility: full, data_sensitivity: medium, scope: single_account, privilege_level: standard_user, procedure_doc: KB-ACS-003}
