# Mẫu theo mã thoát E0–E9 cho B20 (B20 mục 4.2, 7.1, 5.1) — tất định, KHÔNG dùng LLM.
# Nạp + kiểm schema ở backend/app/settings.py (`get_escalation_templates`): thiếu mã nào hoặc chuỗi
# rỗng → lỗi lúc nạp. Sửa file này là đổi hành vi agent (tin nhắn người dùng thấy) → chạy lại test.
#
# user_message : tin gửi người dùng khi ticket chuyển L2 [Chốt 7.1]. E0 trung tính, KHÔNG nêu lý do.
#   E1/E3/E4 (ĐP 08/11, P6 lời nói) mở bằng một câu nói trợ lý hỗ trợ gì, rồi mới báo đã chuyển. Danh sách loại việc trong câu
#   đó PHẢI trùng `enabled_intents` (bật/tắt intent thì sửa cả 3 chỗ — backend/tests/unit/test_messages_scope.py giữ cho khớp).
#   E0 và E1 `injection_suspected` (B20 dùng mẫu E0) giữ câu trung tính, KHÔNG nêu phạm vi.
# next_for_l2  : phần (4) của ghi chú bàn giao — L2 cần làm gì.
# deny_warning : nối vào next_for_l2 với MỌI E5 (2b-Q4: mọi E5 là deny case).
# next_for_l2_by_reason (tuỳ chọn): câu THAY next_for_l2 khi escalation_reason_detail khớp khoá (khoá ∈ REASON_DETAILS).
#   M2 (ĐP 08/11): E5 luật cấm (`policy_deny`) dùng câu E5 chung; lớp AI lỗi (`llm_layer_disabled`) câu riêng. deny_warning vẫn nối.
# user_message_by_reason (tuỳ chọn, Q3 M5 — ĐP 09/11): câu THAY user_message theo escalation_reason_detail (khoá ∈ REASON_DETAILS), đọc
#   như next_for_l2_by_reason; thiếu/lạ → user_message. Khuôn: vì sao (chung — không lộ luật/điểm), ai xử lý, người dùng chờ ở đâu.
#   E5: câu mặc định + llm_high_risk, policy_deny, approval_target_unverified do ĐP soạn; 6 lý do E5 còn lại là câu ĐỀ XUẤT [chờ ĐP duyệt].
#   E0 KHÔNG có mục này (không tiết lộ).
# user_message_repeat (tuỳ chọn, Q13c — 11/11, bản nộp main): ≥ 2 câu THAY user_message khi trong CÙNG phiên đăng nhập đã có ticket khác
#   kết thúc bằng một mã có mục này (B20 đếm). Lần lặp thứ n dùng câu thứ (n-1) mod số câu — ticket đầu phiên giữ câu đầy đủ. Không nêu lại
#   câu phạm vi, không thêm hứa hẹn mới; vẫn nói đã chuyển kỹ thuật viên. Câu theo lý do (user_message_by_reason) vẫn ưu tiên. E0 KHÔNG có.

deny_warning: >-
  CẢNH BÁO: KHÔNG thực hiện lại hành động này. L2 chỉ được xác nhận từ chối và đóng, hoặc mở ticket
  mới chạy lại từ đầu (nguyên tắc 5, D-26).

