# Danh sách thư viện theo docs/spec/build/01-kien-truc-project.md mục 6.
# Phiên bản cụ thể pin trong uv.lock (01 mục 6: "Pin toàn bộ ở T01 bằng uv lock").
# Thêm/bớt phụ thuộc: `uv add` / `uv remove` — đừng cài ngầm bằng pip.

[project]
name = "servicedesk-agent"
version = "0.1.0"
description = "AI Agent tự động hoá IT Service Desk cấp 1 với Human-in-the-Loop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API [Chốt]
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2,<3",
    "pydantic-settings>=2",
    # Điều phối [Chốt]
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres",
    # DB [Chốt]
    "sqlalchemy[asyncio]>=2,<3",
    "alembic",
    "psycopg[binary]>=3,<4",
    # HTTP [Chốt]
    "httpx",
    # Lịch [Chốt]
    "apscheduler>=3,<4",
    # LLM [Đề xuất D-12]
    "openai",
    # Vector [Chốt]
    "qdrant-client",
    # Tiếng Việt [Đề xuất D-10]
    "pyvi",
    # Riêng tư [Đề xuất D-06]
    "unidecode",
    # Bảo mật (P6)
    "pyjwt",
    "argon2-cffi",
    "pyotp",
    "cryptography",
    # Hiệu chỉnh [Chốt]
    "scikit-learn",
    "numpy",
    "scipy",
    # Cấu hình config/*.yaml (slots.yaml — P5/B11)
    "pyyaml>=6.0.3",
    # Băm token BM25 thành chỉ số sparse (P3, rag/bm25.py — thiết kế Phase 3 mục 5.6)
    "mmh3>=5.3.0",
    # Múi giờ IANA cho giờ hành chính của luật R18 (ZoneInfo, PLAN-3h Q-3h-5) — image slim có thể không có /usr/share/zoneinfo
    "tzdata>=2026.4",
]

[dependency-groups]
# `uv sync` cài nhóm dev mặc định.
dev = [
    # Test [Chốt]
    "pytest",
    "pytest-asyncio",
    "respx",
    "testcontainers",
    "hypothesis",
    "locust",
    # Chất lượng (CI)
    "ruff",
    "mypy",
    "import-linter",
    "types-pyyaml>=6.0.12.20260906",  # stub cho mypy
    # Tokenizer bge-m3 thật cho test chunker (marker tokenizer_real, Q-3b-11) — image backend KHÔNG có
    "tokenizers>=0.23.2",
]
# Model nặng của ml-service (P4) — KHÔNG cài mặc định: `uv sync --group ml`.
# sentence-transformers (SentenceTransformer + CrossEncoder), không FlagEmbedding (3-Q19).
# onnxruntime cho model phân loại của nhóm (Phase 5, P11).
ml = [
    "sentence-transformers>=6.1.0",
    "transformers",
    "torch",
    "onnxruntime",
]

[tool.uv]
package = false

# Torch bản CPU cho image ml-service (Q-3a-1): torch trên PyPI cho linux kéo cả bộ CUDA (nvidia-*,
# hàng GB). Chỉ linux lấy từ index CPU của PyTorch; macOS giữ PyPI (bản mac vốn không có CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
# Chỉ unit + integration + e2e. probe/ (LLM thật) và load/ (locust) chạy riêng qua Makefile.
testpaths = ["backend/tests/unit", "backend/tests/integration", "backend/tests/e2e"]
pythonpath = ["backend"]
addopts = "-q --import-mode=importlib"
markers = [
    "ml_real: cần model/tokenizer thật (make models) — chỉ chạy bằng `make test-ml`, không vào make test/CI",
    "tokenizer_real: cần tokenizer bge-m3 thật (make tokenizer) — chạy trong make test; thiếu: local skip, CI FAIL",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"

# APScheduler 3.x không có type stub / py.typed.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

# pyvi (tách từ tiếng Việt cho BM25, rag/bm25.py) không có type stub / py.typed.
[[tool.mypy.overrides]]
module = ["pyvi.*"]
ignore_missing_imports = true

# Nhóm uv `ml` không cài trong CI (make lint): ml_service/app/loader.py import muộn các gói này.
[[tool.mypy.overrides]]
module = ["torch.*", "sentence_transformers.*", "transformers.*", "huggingface_hub.*"]
ignore_missing_imports = true
